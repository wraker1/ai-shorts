name: Render short

on:
  workflow_dispatch:
    inputs:
      story:
        description: 'Story file to render'
        required: true
        default: 'stories/template-test.json'
  push:
    branches: [main]
    paths:
      - 'stories/*.json'

permissions:
  contents: write

concurrency:
  group: renders-branch
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Chrome dependencies for Remotion
        run: sudo apt-get update && sudo apt-get install -y libnss3 libdbus-1-3 libatk1.0-0 libasound2 libxrandr2 libxkbcommon-dev libxfixes3 libxcomposite1 libxdamage1 libgbm-dev libcups2 libatk-bridge2.0-0

      - run: npm install

      - name: Pick story files
        id: pick
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "files=${{ inputs.story }}" >> "$GITHUB_OUTPUT"
          else
            echo "files=$(git diff --name-only --diff-filter=AM HEAD~1 HEAD -- 'stories/*.json' | tr '\n' ' ')" >> "$GITHUB_OUTPUT"
          fi

      - name: Render
        shell: bash
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ vars.ELEVENLABS_VOICE_ID }}
        run: |
          mkdir -p out
          for f in ${{ steps.pick.outputs.files }}; do
            node scripts/make.mjs "$f" 2>&1 | tee -a out/render.log
          done

      - name: Make small previews of the images that were used
        if: always()
        run: |
          mkdir -p /tmp/assets
          for d in public/stories/*/; do
            [ -d "$d" ] || continue
            id="$(basename "$d")"; mkdir -p "/tmp/assets/$id"
            for f in "$d"img*; do
              [ -f "$f" ] && convert "$f[0]" -resize 540x540 -quality 70 "/tmp/assets/$id/$(basename "${f%.*}").jpg" || true
            done
          done
          mkdir -p /tmp/logs && cp out/render.log /tmp/logs/ 2>/dev/null || true

      - name: Save results to the renders branch
        if: always()
        run: |
          mkdir -p /tmp/videos && cp out/*.mp4 /tmp/videos/ 2>/dev/null || true
          MSG="Render ${{ github.run_number }}" scripts/publish.sh /tmp/videos=videos /tmp/assets=assets /tmp/logs=logs
