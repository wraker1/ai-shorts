name: Render short

on:
  workflow_dispatch:
    inputs:
      story:
        description: 'Story file to render'
        required: true
        default: 'stories/template-test.json'
  push:
    branches: [main]
    paths:
      - 'stories/*.json'

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Chrome dependencies for Remotion
        run: sudo apt-get update && sudo apt-get install -y libnss3 libdbus-1-3 libatk1.0-0 libasound2 libxrandr2 libxkbcommon-dev libxfixes3 libxcomposite1 libxdamage1 libgbm-dev libcups2 libatk-bridge2.0-0

      - run: npm install

      - name: Pick story files
        id: pick
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "files=${{ inputs.story }}" >> "$GITHUB_OUTPUT"
          else
            echo "files=$(git diff --name-only HEAD~1 HEAD -- 'stories/*.json' | tr '\n' ' ')" >> "$GITHUB_OUTPUT"
          fi

      - name: Render
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ vars.ELEVENLABS_VOICE_ID }}
        run: |
          for f in ${{ steps.pick.outputs.files }}; do
            node scripts/make.mjs "$f"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: shorts
          path: out/*.mp4

      - name: Save mp4 files to the renders branch
        run: |
          mkdir -p /tmp/r && cp out/*.mp4 /tmp/r/
          git config user.name "render-bot"
          git config user.email "render-bot@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin renders >/dev/null 2>&1; then
            git fetch origin renders
            git checkout -B renders origin/renders
          else
            git checkout --orphan renders
            git rm -rf . >/dev/null 2>&1 || true
          fi
          mkdir -p videos && cp /tmp/r/*.mp4 videos/
          git add videos
          git commit -m "Render ${{ github.run_number }}"
          git push origin renders
